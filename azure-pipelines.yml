trigger:
- master
- main
pool:
  name: SelfHostedPool
variables:
  buildConfiguration: 'Release'
  dotNetVersion: '8.0.x'
stages:
- stage: Build
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '$(dotNetVersion)'
      displayName: 'Install .NET SDK'
    
    # Kokonaisvaltainen puhdistus ja korjaus
    - task: PowerShell@2
      displayName: 'Fix Project Issues and Clean Build'
      inputs:
        targetType: 'inline'
        script: |
          # 1. Korjaa testiprojektin .NET versio
          Write-Host "Fixing RagApi.Tests.csproj TargetFramework"
          $testProjects = Get-ChildItem -Path $(Build.SourcesDirectory) -Filter "*RagApi.Tests.csproj" -Recurse
          foreach ($project in $testProjects) {
            Write-Host "Checking $($project.FullName)"
            $content = Get-Content $project.FullName -Raw
            $newContent = $content -replace "<TargetFramework>net9.0</TargetFramework>", "<TargetFramework>net8.0</TargetFramework>"
            Set-Content $project.FullName $newContent -Force
            Write-Host "Updated $($project.FullName) TargetFramework to net8.0"
          }
          
          # 2. Poista bin ja obj kansiot kokonaan
          Write-Host "Removing bin and obj folders for a clean build"
          Get-ChildItem -Path $(Build.SourcesDirectory) -Include bin,obj -Directory -Recurse | ForEach-Object {
            Write-Host "Removing $($_.FullName)"
            Remove-Item -Path $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
          }
          
          # 3. Varmista, että ei ole jäljellä AssemblyAttributes-tiedostoja
          Write-Host "Removing any lingering AssemblyAttributes.cs files"
          Get-ChildItem -Path $(Build.SourcesDirectory) -Include "*AssemblyAttributes.cs" -Recurse | ForEach-Object {
            Write-Host "Removing $($_.FullName)"
            Remove-Item -Path $_.FullName -Force -ErrorAction SilentlyContinue
          }
    
    # Tehdään dotnet clean vielä varmuuden vuoksi
    - task: DotNetCoreCLI@2
      inputs:
        command: 'custom'
        custom: 'clean'
        projects: '**/*.csproj'
      displayName: 'Clean dotnet projects'
    
    # Restore NuGet-paketit
    - task: DotNetCoreCLI@2
      inputs:
        command: 'restore'
        projects: '**/*.csproj'
      displayName: 'Restore NuGet packages'
    
    # Kokeillaan eri lähestymistapaa build-vaiheessa
    - task: PowerShell@2
      displayName: 'Custom Build With MSBuild Parameters'
      inputs:
        targetType: 'inline'
        script: |
          # Käytetään dotnet build -komentoa mukautetuilla parametreilla
          Write-Host "Building projects with custom parameters"
          dotnet build --configuration $(buildConfiguration) --no-restore /p:GenerateAssemblyInfo=false /p:GenerateTargetFrameworkAttribute=false
    
    # Testien ajo
    - task: DotNetCoreCLI@2
      inputs:
        command: 'test'
        projects: '**/RagApi.Tests.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build'
        publishTestResults: true
      displayName: 'Run Unit Tests'
    
    # Julkaisu
    - task: DotNetCoreCLI@2
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory) --no-build'
        zipAfterPublish: true
      displayName: 'Publish projects'
    
    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'drop'
      displayName: 'Publish artifacts'
- stage: Deploy
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployToAzure
    steps:
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'
      displayName: 'Download Build Artifacts'
        
    - task: AzureWebApp@1
      inputs:
        azureSubscription: 'AzureRagApiConnection'
        appType: 'webApp'
        appName: 'ragapi'
        package: '$(System.ArtifactsDirectory)/drop/**/*.zip'
        deploymentMethod: 'auto'
      displayName: 'Deploy to Azure App Service'