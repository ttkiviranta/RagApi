trigger:
- master
- main
pool:
  name: SelfHostedPool
variables:
  buildConfiguration: 'Release'
  dotNetVersion: '8.0.x'
stages:
- stage: Build
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '$(dotNetVersion)'
      displayName: 'Install .NET SDK'
    
    # 1. Poista obj-kansiot
    - task: PowerShell@2
      displayName: 'Clean obj folders'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "Removing obj folders to prevent duplicate attribute errors"
          Get-ChildItem -Path $(Build.SourcesDirectory) -Include "obj" -Directory -Recurse | ForEach-Object {
            Write-Host "Removing $($_.FullName)"
            Remove-Item -Path $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
          }
    
    # 2. Korjaa testiprojektin versio
    - task: PowerShell@2
      displayName: 'Fix Test Project Framework'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "Fixing Test Project Framework version"
          $testProject = Get-ChildItem -Path $(Build.SourcesDirectory) -Filter "*RagApi.Tests.csproj" -Recurse | Select-Object -First 1
          if ($testProject) {
            Write-Host "Found test project at $($testProject.FullName)"
            $content = Get-Content $testProject.FullName -Raw
            $updatedContent = $content -replace "<TargetFramework>net9.0</TargetFramework>", "<TargetFramework>net8.0</TargetFramework>"
            Set-Content $testProject.FullName $updatedContent -Force
            Write-Host "Updated TargetFramework to net8.0"
          }
    
    # 3. Käännä ja julkaise pääprojekti estäen automaattiset attribuutit
    - task: DotNetCoreCLI@2
      inputs:
        command: 'restore'
        projects: '**/*.csproj'
      displayName: 'Restore NuGet packages'
    
    - task: DotNetCoreCLI@2
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration) /p:GenerateAssemblyInfo=false'
      displayName: 'Build projects (without auto assembly info)'
    
    # 4. Testaa testiprojekti
    - task: DotNetCoreCLI@2
      inputs:
        command: 'test'
        projects: '**/RagApi.Tests.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build'
        publishTestResults: true
        continueOnError: true
      displayName: 'Run Unit Tests (Allow Failure)'
    
    # 5. Julkaise sovellus
    - task: DotNetCoreCLI@2
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory) /p:GenerateAssemblyInfo=false'
      displayName: 'Publish projects (without auto assembly info)'
    
    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'drop'
      displayName: 'Publish artifacts'
- stage: Deploy
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployToAzure
    steps:
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'
      displayName: 'Download Build Artifacts'
        
    - task: AzureWebApp@1
      inputs:
        azureSubscription: 'AzureRagApiConnection'
        appType: 'webApp'
        appName: 'ragapi'
        package: '$(System.ArtifactsDirectory)/drop/**/*.zip'
        deploymentMethod: 'auto'
      displayName: 'Deploy to Azure App Service'