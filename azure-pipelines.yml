trigger:
- master
- main
pool:
  name: SelfHostedPool
variables:
  buildConfiguration: 'Release'
  dotNetVersion: '8.0.x'
stages:
- stage: Build
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '$(dotNetVersion)'
      displayName: 'Install .NET SDK'
    # Lisätty manuaalinen korjaus TargetFramework-määritykselle
    - task: PowerShell@2
      displayName: 'Fix TargetFramework'
      inputs:
        targetType: 'inline'
        script: |
          $csprojPath = "$(Build.SourcesDirectory)\RagApi\RagApi.Tests\RagApi.Tests.csproj"
          Write-Host "Fixing TargetFramework in $csprojPath"
          if (Test-Path $csprojPath) {
            $content = Get-Content $csprojPath -Raw
            $newContent = $content -replace "<TargetFramework>net9.0</TargetFramework>","<TargetFramework>net8.0</TargetFramework>"
            Set-Content $csprojPath $newContent -NoNewline
            Write-Host "TargetFramework updated successfully"
          } else {
            Write-Host "File not found at $csprojPath"
            Write-Host "Searching for RagApi.Tests.csproj files..."
            $files = Get-ChildItem -Path $(Build.SourcesDirectory) -Filter "RagApi.Tests.csproj" -Recurse
            foreach ($file in $files) {
              Write-Host "Found: $($file.FullName)"
              $content = Get-Content $file.FullName -Raw
              $newContent = $content -replace "<TargetFramework>net9.0</TargetFramework>","<TargetFramework>net8.0</TargetFramework>"
              Set-Content $file.FullName $newContent -NoNewline
              Write-Host "Updated TargetFramework in $($file.FullName)"
            }
          }
    # Lisätty väliaikaisten käännöstiedostojen puhdistus
    - task: PowerShell@2
      displayName: 'Clean obj and bin folders'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "Cleaning obj and bin folders to fix duplicate attribute errors"
          Get-ChildItem -Path $(Build.SourcesDirectory) -Include bin,obj -Directory -Recurse | ForEach-Object {
            Write-Host "Removing $($_.FullName)"
            Remove-Item -Path $_.FullName -Recurse -Force
          }
    - task: DotNetCoreCLI@2
      inputs:
        command: 'restore'
        projects: '**/*.csproj'
      displayName: 'Restore NuGet packages'
    - task: DotNetCoreCLI@2
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'
      displayName: 'Build projects'
    # Päivitetty yksikkötestien ajo vastaamaan projektisi rakennetta
    - task: DotNetCoreCLI@2
      inputs:
        command: 'test'
        projects: '**/RagApi.Tests.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build --verbosity detailed'
        publishTestResults: true
      displayName: 'Run Unit Tests'
    - task: DotNetCoreCLI@2
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory) --no-build'
        zipAfterPublish: true
      displayName: 'Publish projects'
    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'drop'
      displayName: 'Publish artifacts'
- stage: Deploy
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployToAzure
    steps:
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'
      displayName: 'Download Build Artifacts'
        
    - task: AzureWebApp@1
      inputs:
        azureSubscription: 'AzureRagApiConnection'
        appType: 'webApp'
        appName: 'ragapi'
        package: '$(System.ArtifactsDirectory)/drop/**/*.zip'
        deploymentMethod: 'auto'
      displayName: 'Deploy to Azure App Service'