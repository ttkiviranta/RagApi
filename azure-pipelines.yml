trigger:
- master
- main
pool:
  name: SelfHostedPool
variables:
  buildConfiguration: 'Release'
  dotNetVersion: '8.0.x'
stages:
- stage: Build
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '$(dotNetVersion)'
      displayName: 'Install .NET SDK'
    # Yksinkertainen puhdistus
    - task: PowerShell@2
      displayName: 'Clean build artifacts'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "Cleaning bin and obj folders"
          Get-ChildItem -Path $(Build.SourcesDirectory) -Include bin,obj -Directory -Recurse | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
    - task: DotNetCoreCLI@2
      inputs:
        command: 'restore'
        projects: '**/*.csproj'
      displayName: 'Restore NuGet packages'
    - task: DotNetCoreCLI@2
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'
      displayName: 'Build projects'
    # Testien ajo
    - task: DotNetCoreCLI@2
      inputs:
        command: 'test'
        projects: '**/RagApi.Tests.csproj'
        arguments: '--configuration $(buildConfiguration)'
        publishTestResults: true
      displayName: 'Run Unit Tests'
    - task: DotNetCoreCLI@2
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true
      displayName: 'Publish projects'
    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'drop'
      displayName: 'Publish artifacts'
- stage: Deploy
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployToAzure
    steps:
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'
      displayName: 'Download Build Artifacts'
        
    - task: AzureWebApp@1
      inputs:
        azureSubscription: 'AzureRagApiConnection'
        appType: 'webApp'
        appName: 'ragapi'
        package: '$(System.ArtifactsDirectory)/drop/**/*.zip'
        deploymentMethod: 'auto'
      displayName: 'Deploy to Azure App Service'