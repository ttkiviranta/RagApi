trigger:
- master
- main

pool:
  name: SelfHostedPool

variables:
  buildConfiguration: 'Release'
  dotNetVersion: '8.0.x'

stages:
- stage: Build
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '$(dotNetVersion)'
      displayName: 'Install .NET SDK'
    
    # Puhdista käännösympäristö
    - task: PowerShell@2
      displayName: 'Clean Build Environment'
      inputs:
        targetType: 'inline'
        script: 'Get-ChildItem -Path $(Build.SourcesDirectory) -Include bin,obj -Directory -Recurse | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue'
    
    # Käännä ja julkaise pääprojekti
    - task: DotNetCoreCLI@2
      displayName: 'Publish Main Project'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '**/RagApi.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory) /p:GenerateAssemblyInfo=false'
        zipAfterPublish: true
      continueOnError: true
    
    # Julkaise artefaktit
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifacts'
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'drop'
      continueOnError: true
      
- stage: Deploy
  dependsOn: Build
  condition: succeededOrFailed()
  jobs:
  - job: DeployToAzure
    steps:
    - task: DownloadBuildArtifacts@1
      displayName: 'Download Build Artifacts'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'
      continueOnError: true
    
    - task: AzureWebApp@1
      displayName: 'Deploy to Azure App Service'
      inputs:
        azureSubscription: 'AzureRagApiConnection'
        appType: 'webApp'
        appName: 'ragapi'
        package: '$(System.ArtifactsDirectory)/drop/**/*.zip'
        deploymentMethod: 'auto'
      continueOnError: true